name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required files
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'agent.py',
              'app.py',
              'agent.md',
              'agent-ada.md',
              'agent-lint.md',
              'agent-val.md',
              'memory.md',
          ]
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit(f'Arquivos ausentes: {missing}')
          print('Arquivos obrigatórios OK')
          PY

      - name: Compile Python modules
        run: python -m compileall agent.py app.py

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
