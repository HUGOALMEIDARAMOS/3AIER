name: Agent Guardrails

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  agent-smoke:
    name: agent-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required prompt files
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'agent.md',
              'agent-ada.md',
              'agent-lint.md',
              'agent-val.md',
              'memory.md',
          ]
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit(f'Arquivos ausentes: {missing}')
          print('Prompt files OK')
          PY

      - name: Compile app modules
        run: python -m compileall agent.py app.py

      - name: Import smoke test
        run: |
          python - <<'PY'
          import ast
          import importlib.util

          for name in ('agent',):
              path = f'./{name}.py'
              with open(path, 'r', encoding='utf-8') as fh:
                  ast.parse(fh.read(), filename=path)

              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              print(f'import ok: {name}')
          PY

  evals:
    name: evals
    runs-on: ubuntu-latest
    needs: agent-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluation smoke check
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('agent.md'),
              Path('agent-ada.md'),
              Path('agent-lint.md'),
              Path('agent-val.md'),
          ]
          for file in files:
              text = file.read_text(encoding='utf-8')
              assert 'system' in text.lower() or 'prompt' in text.lower() or 'agente' in text.lower(), file
          print('evals OK')
          PY
